name: test

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: python -m unittest discover -s evaluators/pyvisa_dut_validation_v1/tests -v

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: evaluator
      - uses: actions/checkout@v4
        with:
          repository: briteny-pwn/instrument-benchmark-instances
          path: instance
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - working-directory: evaluator
        run: python -m pip install -e .
      - name: Docker integration
        working-directory: evaluator
        env:
          IAB_RUN_DOCKER_TESTS: "1"
          IAB_INSTANCE_ROOT: ${{ github.workspace }}/instance/pyvisa_dut_validation_v1
        run: |
          python -m unittest \
            tests.integration.test_container_image_linux \
            tests.integration.test_container_isolation_linux \
            tests.integration.test_docker_full_suite_linux -v
      - name: Capture Docker evidence
        if: always()
        run: |
          mkdir -p artifacts
          docker version > artifacts/docker-version.txt 2>&1 || true
          docker ps -a --no-trunc > artifacts/docker-containers.txt 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docker-evidence
          path: artifacts
      - name: Cleanup benchmark containers
        if: always()
        run: |
          ids="$(docker ps -aq --filter 'label=iab.managed=true')"
          if [ -n "$ids" ]; then docker rm -f $ids; fi
