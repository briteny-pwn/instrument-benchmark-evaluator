name: test

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: evaluator
      - uses: actions/checkout@v4
        with:
          repository: briteny-pwn/instrument-benchmark-instances
          path: instance
      - uses: actions/checkout@v4
        with:
          repository: briteny-pwn/instrument-benchmark
          path: instrument
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - working-directory: evaluator
        run: python -m pip install -e . -e ../instrument pytest
      - working-directory: evaluator
        run: >-
          PYTHONPATH=vendor/pyvisa-sim-iab:.
          python -m pytest tests sources -q

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: evaluator
      - uses: actions/checkout@v4
        with:
          repository: briteny-pwn/instrument-benchmark-instances
          path: instance
      - uses: actions/checkout@v4
        with:
          repository: briteny-pwn/instrument-benchmark
          path: instrument
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - working-directory: evaluator
        run: python -m pip install -e .
      - working-directory: instrument
        run: python -m pip install -e .
      - name: Docker integration
        working-directory: evaluator
        env:
          IAB_RUN_DOCKER_TESTS: "1"
          IAB_CONTAINER_OWNER: evaluator-${{ github.run_id }}-${{ github.run_attempt }}
          IAB_INSTANCE_ROOT: ${{ github.workspace }}/instance/sources/pyvisa/pyvisa_dut_validation_v1
          IAB_INSTANCE_V2_ROOT: ${{ github.workspace }}/instance/sources/pyvisa/pyvisa_dut_validation_v2
          IAB_INSTRUMENT_ROOT: ${{ github.workspace }}/instrument
          PYTHONPATH: vendor/pyvisa-sim-iab:.
        run: |
          python -m unittest \
            tests.integration.test_container_image_linux \
            tests.integration.test_container_isolation_linux \
            tests.integration.test_docker_full_suite_linux \
            tests.integration.test_v2_dual_container_linux -v
      - name: Capture Docker evidence
        if: always()
        run: |
          mkdir -p artifacts
          docker version > artifacts/docker-version.txt 2>&1 || true
          docker ps -a --no-trunc > artifacts/docker-containers.txt 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docker-evidence
          path: artifacts
      - name: Cleanup benchmark containers
        if: always()
        run: |
          ids="$(docker ps -aq --filter 'label=iab.owner=evaluator-${{ github.run_id }}-${{ github.run_attempt }}')"
          if [ -n "$ids" ]; then docker rm -f $ids; fi
