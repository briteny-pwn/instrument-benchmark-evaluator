[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "instrument-benchmark-evaluator"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "jsonschema==4.25.1",
  "PyYAML==6.0.3",
  "PyVISA==1.16.2",
  "PyVISA-sim==0.7.1",
]

[project.scripts]
instrument-evaluator = "instrument_benchmark_evaluator.cli:main"

[tool.setuptools.packages.find]
include = ["instrument_benchmark_evaluator*", "sources*"]

[tool.setuptools.package-data]
"sources.pyvisa" = ["source.yaml"]
"sources.openfibsem" = ["source.yaml"]
"sources.pyvisa.pyvisa_dut_validation_v1" = [
  "evaluator.yaml",
  "adversarial_matrix.yaml",
  "simulator/*.yaml",
  "worlds/*.yaml",
]
"sources.pyvisa.pyvisa_dut_validation_v2" = ["evaluator.yaml", "simulator.yaml"]
"sources.openfibsem.fibsem_liftout_v1" = ["evaluator.yaml", "scenarios/*.json"]

[tool.pytest.ini_options]
markers = [
  "openfibsem: requires the pinned OpenFIBSEM source/runtime",
]
